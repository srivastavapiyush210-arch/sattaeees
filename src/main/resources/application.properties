# ====================================================================
# Sattaees Core Application Configuration
# ====================================================================
spring.application.name=sattaees

# Profile activation (default: local)
spring.profiles.default=local

# --------------------------------------------------------------------
# Database & Flyway
# --------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --------------------------------------------------------------------
# Security & JWT Configuration
# --------------------------------------------------------------------
jwt.secret=${JWT_SECRET:dGhpc2lzYXN1cGVyc2VjcmV0a2V5dGhhdG5lZWRzdG9iZWF0bGVhc3QyNTZiaXRzbG9uZ2ZvcmhtYWNzaGEyNTYxMjM0NQ==}
# Access token: 24 hours (86,400,000 ms)
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:86400000}
# Refresh token: 7 days (604,800,000 ms)
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:80,http://localhost}

# --------------------------------------------------------------------
# Redis Cache Configuration
# --------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
# Cache TTL: 15 minutes (900000 ms)
app.cache.redis.time-to-live-millis=900000

# --------------------------------------------------------------------
# Apache Kafka Configuration
# --------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=sattaees-notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.sattaees.sattaees.*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.kafka.topics.job-events=sattaees.job-events
app.kafka.topics.review-events=sattaees.review-events

# --------------------------------------------------------------------
# Actuator & Observability
# --------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true

# --------------------------------------------------------------------
# OpenAPI / Swagger
# --------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# --------------------------------------------------------------------
# Structured Logging & MDC
# --------------------------------------------------------------------
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([traceId=%X{traceId}]){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n
logging.level.com.sattaees.sattaees=INFO
logging.level.org.springframework.security=INFO
